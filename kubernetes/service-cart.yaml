apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: sap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
    - name: cart
      image: cart:latest
      ports:
      - containerPort: 3002
      env:
      - nme: PORT
        value: "3002"
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: secret-db
            key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: sap
spec:
  type: ClusterIP
  selector:
    app: cart
  ports:
  - port: 3002
    targetPort: 3002