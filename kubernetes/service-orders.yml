apiVersion: apps/v1
kind: Deployment
metadata:
  name:  orders
  namespace: sap
spec:
  selector:
    matchLabels:
      app: orders
  replicas: 1
  template:
    metadata:
      labels:
        app:  orders
    spec:
      containers:
      - name:  orders
        image: shahir5890/backend_orders:17
        env:
        - name: PORT
          value: "3005"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: secret-db
              key: DATABASE_URL
        ports:
        - containerPort:  3005
---
kind: Service
apiVersion: v1
metadata:
  name:  orders
  namespace: sap
spec:
  selector:
    app:  orders
  type:  ClusterIP
  ports:
  - port:  3005
    targetPort:  3005